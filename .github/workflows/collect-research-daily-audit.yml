name: Collect and audit current CSI 300 daily history

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/collect-research-daily-audit.yml
      - scripts/collect_research_daily.py
      - scripts/audit_research_daily.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install current AKShare
        run: python -m pip install --disable-pip-version-check 'akshare>=1.20.54'
      - name: Collect current CSI 300 daily bars (2016–2025)
        id: collect
        continue-on-error: true
        run: |
          python scripts/collect_research_daily.py \
            --current-csi300 --start 20160101 --end 20251231 \
            --out "$RUNNER_TEMP/csi300_daily_snapshot"
      - name: Audit coverage and file integrity only
        if: always()
        run: |
          python scripts/audit_research_daily.py \
            --data-dir "$RUNNER_TEMP/csi300_daily_snapshot" \
            --output advanced/volume-2/REAL_DATA_300_AUDIT.md
      - name: Publish aggregate audit only (never raw market files)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advanced/volume-2/REAL_DATA_300_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "Add current CSI 300 daily data coverage audit"
            git push
          fi
      - name: Mark collection failure accurately
        if: steps.collect.outcome == 'failure'
        run: |
          echo "AKShare collection was incomplete; inspect this run's logs and aggregate audit."
          exit 1
