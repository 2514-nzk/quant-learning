name: Publish reading site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out three-volume reader source
        uses: actions/checkout@v4
        with:
          ref: docs/three-volume-research-framework
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check reader JavaScript syntax
        run: node --check reader/app.js && node --check reader/pyodide-worker.js && node --check reader/real-case.js && node tests/real_browser_lab.test.js && node tests/test_reader_volume_pager.js
      - name: Verify research-audit lab
        run: |
          python -m unittest discover -s tests -p "test_research_audit_lab.py" -v
          python -m unittest discover -s tests -p "test_curriculum_links.py" -v
          python examples/research_audit_lab.py
          python -m unittest discover -s tests -p "test_deep_dive_labs.py" -v
          python examples/factor_diagnostics_lab.py
          python examples/model_selection_audit.py
          python -m unittest discover -s tests -p "test_beginner_examples.py" -v
          python -m unittest discover -s tests -p "test_trader_friendly_route.py" -v
          python -m unittest discover -s tests -p "test_reader_reset.py" -v
          python -m unittest discover -s tests -p "test_real_a_share.py" -v
          python -m unittest discover -s tests -p "test_foundation_order.py" -v
          python -m unittest discover -s tests -p "test_learning_flow.py" -v
          python -m unittest discover -s tests -p "test_concept_first_sequence.py" -v
          python -m unittest discover -s tests -p "test_natural_concept_transitions.py" -v
          python -m unittest discover -s tests -p "test_random_forest_intro.py" -v
          python -m unittest discover -s tests -p "test_rankic_readability.py" -v
          python -m unittest discover -s tests -p "test_markdown_bold_delimiters.py" -v
          python -m unittest discover -s tests -p "test_cointegration_lesson.py" -v
          python -m unittest discover -s tests -p "test_financial_quality_lesson.py" -v
          python examples/financial_quality_lab.py
          python examples/cointegration_pair_lab.py
          python -m unittest discover -s tests -p "test_real_course_runner.py" -v
          python -m unittest discover -s tests -p "test_standalone_book.py" -v
          python examples/real_stock_learner.py
          python examples/real_kline_lab.py --symbol 000001
      - name: Verify real historical OHLC evidence gates (unittest and direct CLI)
        run: |
          python -m unittest discover -s tests -p "test_advanced_real_evidence_audit.py" -v
          python examples/advanced_real_evidence_audit.py --json > /tmp/real_ohlc_evidence.json
          python -c 'import json; d=json.load(open("/tmp/real_ohlc_evidence.json", encoding="utf-8")); assert d["evidence_grade"].startswith("DESCRIPTIVE_ONLY") and d["gates"]["L4_historical_full_universe"].startswith("FAIL_"); print("Real-price limitations preserved")'
      - name: Verify canonical chapter numbering and volume sidebar taxonomy
        run: python -m unittest discover -s tests -p "test_sidebar_taxonomy.py" -v
      - name: Verify A-share-local PIT event timestamps and label-availability gate
        run: |
          python -m unittest discover -s tests -p "test_advanced_pit_intake_lab.py" -v
          python examples/advanced_pit_intake_lab.py --json > /tmp/pit_intake_contract.json
          python -c 'import json; d=json.load(open("/tmp/pit_intake_contract.json", encoding="utf-8")); assert d["train_labels_purged"] == 1 and not d["historical_pit_proven"] and d["membership_asof"]["B"].startswith("UNKNOWN"); print("PIT demonstration gates passed")'
      - name: Build reading site
        run: python reader/build_reader.py --output _site
      - name: Validate all three volumes on canonical homepage
        run: |
          python -m unittest discover -s tests -p "test_reader_preview.py" -v
          python -m unittest discover -s tests -p "test_advanced_framework.py" -v
          python - <<'PY'
          import json
          from pathlib import Path
          site = Path("_site")
          data = json.loads((site / "content.json").read_text(encoding="utf-8"))
          first, advanced = data["documents"], data["framework"]
          assert len(first) == 22, "first-volume reading track changed (optional pair case moved to volume 3)"
          assert all(doc["group"].startswith("第一卷｜") for doc in first)
          assert sum(doc["title"].startswith("第 ") and doc["group"].startswith("第二卷｜第 ") for doc in advanced) == 14
          assert sum(doc["title"].startswith("第 ") and doc["group"].startswith("第三卷｜第 ") for doc in advanced) == 13
          assert len(advanced) == 31, "14 chapters and 2 evidence appendices plus third volume expected"
          assert sum(doc["path"].startswith("advanced/volume-2/") for doc in advanced) == 17
          assert sum(doc["path"].startswith("advanced/volume-3/") for doc in advanced) == 14
          homepage = (site / "index.html").read_text(encoding="utf-8")
          assert "三卷量化研究教材" in homepage
          assert "第一卷" in homepage and "第二卷" in homepage
          # Keep earlier /preview/?chapter=... URLs working after the move to /.
          legacy = site / "preview"
          legacy.mkdir(exist_ok=True)
          (legacy / "index.html").write_text(
              '<!doctype html><html lang="zh-CN"><meta charset="utf-8">'
              '<title>正在打开新版阅读器</title>'
              '<script>location.replace("../"+location.search+location.hash)</script>'
              '<a href="../">进入三卷阅读器</a></html>', encoding="utf-8")
          print("Canonical reader: first 22 items, volume two 14 chapters + 2 evidence appendices, volume three 13 slots")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
