name: Verify learning materials

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate course links
        run: python -m unittest discover -s tests -p "test_curriculum_links.py" -v
      - name: Validate audit exercise
        run: |
          python -m unittest discover -s tests -p "test_research_audit_lab.py" -v
          python examples/research_audit_lab.py
      - name: Verify factor and model deep dives
        run: |
          python -m unittest discover -s tests -p "test_deep_dive_labs.py" -v
          python examples/factor_diagnostics_lab.py
          python examples/model_selection_audit.py
      - name: Verify beginner arithmetic and workbook
        run: python -m unittest discover -s tests -p "test_beginner_examples.py" -v
      - name: Check self-contained first-pass lessons and fee examples
        run: python -m unittest discover -s tests -p "test_trader_friendly_route.py" -v
      - name: Check reading-history reset behavior
        run: python -m unittest discover -s tests -p "test_reader_reset.py" -v
      - name: Verify actual AKShare historical candles and lessons
        run: |
          python -m unittest discover -s tests -p "test_real_a_share.py" -v
          python examples/real_kline_lab.py --symbol 000001
      - name: Check foundations appear before relevant chapters
        run: python -m unittest discover -s tests -p "test_foundation_order.py" -v
      - name: Verify concept prerequisites and chapter order
        run: |
          python -m unittest discover -s tests -p "test_learning_flow.py" -v
          python -m unittest discover -s tests -p "test_concept_first_sequence.py" -v
          python -m unittest discover -s tests -p "test_natural_concept_transitions.py" -v
          python -m unittest discover -s tests -p "test_random_forest_intro.py" -v
      - name: Confirm real-stock pricing and browser labs
        run: |
          python -m unittest discover -s tests -p "test_real_course_runner.py" -v
          python examples/real_stock_learner.py
      - name: Check independent new-book narrative and account consistency
        run: python -m unittest discover -s tests -p "test_standalone_book.py" -v
      - name: Verify browser real-data calculator without Pyodide
        run: |
          node --check reader/app.js
          node --check reader/real-case.js
          node tests/real_browser_lab.test.js
      - name: Verify plain-language terminology and real RankIC examples
        run: python -m unittest discover -s tests -p "test_rankic_readability.py" -v
      - name: Verify real-price cointegration lesson and optional lab
        run: |
          python -m unittest discover -s tests -p "test_cointegration_lesson.py" -v
          python examples/cointegration_pair_lab.py
      - name: Verify actual annual-report accounting and financial-quality lesson
        run: |
          python -m unittest discover -s tests -p "test_financial_quality_lesson.py" -v
          python examples/financial_quality_lab.py
      - name: Check Markdown bold punctuation boundaries
        run: python -m unittest discover -s tests -p "test_markdown_bold_delimiters.py" -v
      - name: Verify research contract and PIT lab
        run: |
          python -m unittest discover -s tests -p "test_advanced_protocol_pit_lab.py" -v
          python examples/advanced_protocol_pit_lab.py --json
      - name: Verify factor time-splits, neutralization and inference lab
        run: |
          python -m unittest discover -s tests -p "test_advanced_factor_research_lab.py" -v
          python examples/advanced_factor_research_lab.py --json
      - name: Verify model selection, ablation and prequential holdout lab
        run: |
          python -m unittest discover -s tests -p "test_advanced_model_validation_lab.py" -v
          python examples/advanced_model_validation_lab.py --json > /tmp/model_validation_lab.json
          python -c 'import json; d=json.load(open("/tmp/model_validation_lab.json",encoding="utf-8")); assert d["total_periods"]==42 and d["source_kind"].startswith("SYNTHETIC_ONLY"); print("Synthetic OOS boundary lab passed")'
      - name: Verify portfolio constraints, order ledger and reproducible capstone
        run: |
          python -m unittest discover -s tests -p "test_advanced_portfolio_execution_lab.py" -v
          python examples/advanced_portfolio_execution_lab.py --json > /tmp/advanced_portfolio_audit.json
          python -c 'import json; d=json.load(open("/tmp/advanced_portfolio_audit.json",encoding="utf-8")); assert d["source_kind"].startswith("SYNTHETIC_ONLY") and len(d["cases"])==3 and all(a["nav_reconciles"] for a in d["audit"].values()); print("Synthetic portfolio audit passed")'
      - name: Verify math, time-series and date-versioned A-share trading rules
        run: |
          python -m unittest discover -s tests -p "test_advanced_foundations_market_rules_lab.py" -v
          python examples/advanced_foundations_market_rules_lab.py --json > /tmp/advanced_foundations_rules.json
          python -c 'import json; d=json.load(open("/tmp/advanced_foundations_rules.json", encoding="utf-8")); assert d["source_kind"].startswith("SYNTHETIC_") and len(d["market_rules"]["versioned_profiles"])==7; print("Synthetic foundations and official rule-version gate passed")'
      - name: Validate three-volume reader preview and math links
        run: |
          python -m unittest discover -s tests -p "test_reader_preview.py" -v
          node --check reader/app.js
      - name: Validate three-volume framework and chapter outlines
        run: python -m unittest discover -s tests -p "test_advanced_framework.py" -v
      - name: Build course with advanced learning track
        run: |
          python reader/build_reader.py --output _site
          python -c 'import json; d=json.load(open("_site/content.json",encoding="utf-8")); assert len(d["documents"])==23 and any(x["path"]=="教程/真实_起步一课.md" for x in d["documents"]); assert all(x["path"].startswith("教程/真实_") for x in d["documents"]); assert len(d["framework"])==29; print("Published real-stock lessons:",len(d["documents"]))'
