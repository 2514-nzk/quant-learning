name: Publish reading site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check reader JavaScript syntax
        run: node --check reader/app.js && node --check reader/pyodide-worker.js && node --check reader/real-case.js && node tests/real_browser_lab.test.js
      - name: Verify research-audit lab
        run: |
          python -m unittest discover -s tests -p "test_research_audit_lab.py" -v
          python -m unittest discover -s tests -p "test_curriculum_links.py" -v
          python examples/research_audit_lab.py
          python -m unittest discover -s tests -p "test_deep_dive_labs.py" -v
          python examples/factor_diagnostics_lab.py
          python examples/model_selection_audit.py
          python -m unittest discover -s tests -p "test_beginner_examples.py" -v
          python -m unittest discover -s tests -p "test_trader_friendly_route.py" -v
          python -m unittest discover -s tests -p "test_reader_reset.py" -v
          python -m unittest discover -s tests -p "test_real_a_share.py" -v
          python -m unittest discover -s tests -p "test_foundation_order.py" -v
          python -m unittest discover -s tests -p "test_learning_flow.py" -v
          python -m unittest discover -s tests -p "test_concept_first_sequence.py" -v
          python -m unittest discover -s tests -p "test_natural_concept_transitions.py" -v
          python -m unittest discover -s tests -p "test_random_forest_intro.py" -v
          python -m unittest discover -s tests -p "test_rankic_readability.py" -v
          python -m unittest discover -s tests -p "test_markdown_bold_delimiters.py" -v
          python -m unittest discover -s tests -p "test_cointegration_lesson.py" -v
          python -m unittest discover -s tests -p "test_financial_quality_lesson.py" -v
          python examples/financial_quality_lab.py
          python examples/cointegration_pair_lab.py
          python -m unittest discover -s tests -p "test_real_course_runner.py" -v
          python -m unittest discover -s tests -p "test_standalone_book.py" -v
          python examples/real_stock_learner.py
          python examples/real_kline_lab.py --symbol 000001
      - name: Build reading site
        run: python reader/build_reader.py --output _site
      - name: Check out second-volume preview branch
        uses: actions/checkout@v4
        with:
          ref: docs/three-volume-research-framework
          path: preview-source
          persist-credentials: false
      - name: Verify and build independent course preview
        run: |
          cd preview-source
          node --check reader/app.js
          python -m unittest discover -s tests -p "test_reader_preview.py" -v
          python -m unittest discover -s tests -p "test_advanced_framework.py" -v
          python reader/build_reader.py --output _site
          cd ..
          python - <<'PY'
          import json
          from pathlib import Path
          preview = Path("preview-source/_site")
          data = json.loads((preview / "content.json").read_text(encoding="utf-8"))
          first, advanced = data["documents"], data["framework"]
          assert len(first) == 23, "first-volume route changed"
          assert len(advanced) == 29, "advanced volume navigation incomplete"
          assert sum(x["path"].startswith("advanced/volume-2/") for x in advanced) == 15
          assert sum(x["path"].startswith("advanced/volume-3/") for x in advanced) == 14
          assert (preview / "index.html").is_file()
          print("Preview ready: first-volume 23 items, second 15, third 14")
          PY
          cp -a preview-source/_site _site/preview
          test -f _site/preview/content.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
