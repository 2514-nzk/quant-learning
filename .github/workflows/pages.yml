name: Publish reading site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check reader JavaScript syntax
        run: node --check reader/app.js && node --check reader/pyodide-worker.js
      - name: Verify research-audit lab
        run: |
          python -m unittest discover -s tests -p "test_research_audit_lab.py" -v
          python -m unittest discover -s tests -p "test_curriculum_links.py" -v
          python examples/research_audit_lab.py
          python -m unittest discover -s tests -p "test_deep_dive_labs.py" -v
          python examples/factor_diagnostics_lab.py
          python examples/model_selection_audit.py
      - name: Build reading site
        run: python reader/build_reader.py --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
