name: Collect AKShare real A-share teaching charts

on:
  # Run on the setup branch once, then keep manual refresh available from Actions.
  push:
    branches: [real-famous-a-shares-main-course-20261111]
    paths:
      - scripts/collect_real_a_share.py
      - .github/workflows/collect-real-a-share.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install AKShare
        run: python -m pip install --disable-pip-version-check 'akshare>=1.16'
      - name: Capture actual historical daily bars
        run: python scripts/collect_real_a_share.py
      - name: Check captured candle consistency
        run: python -m unittest discover -s tests -p 'test_real_a_share.py' -v
      - name: Save exact data, provenance and charts in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real_a_share reader/assets/real-a-share
          if ! git diff --cached --quiet; then
            git commit -m "Capture AKShare 2024 historical candle teaching snapshot"
            git push
          else
            echo 'No changes to commit'
          fi
